<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>原子能级跃迁：光子发射与吸收</title><style>body{margin:0;overflow:hidden;font-family:monospace}#info{position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.7);padding:12px;border-radius:12px;color:#fff;z-index:20}#calc{position:absolute;top:20px;right:20px;width:300px;background:rgba(0,0,0,0.7);padding:12px;border-radius:12px;color:#ffdd99;z-index:20}#control{position:absolute;bottom:20px;left:20px;right:20px;background:rgba(0,0,0,0.7);border-radius:40px;padding:10px;display:flex;gap:20px;justify-content:center;z-index:20}</style></head>
<body><div id="info"><h1>🌟 原子能级跃迁 | 光子发射与吸收</h1><p>激发原子发射光子（考虑反冲）或基态原子吸收光子跃迁。</p></div>
<div id="calc"><h3>📐 光子频率</h3><div>发射光子频率 ν_emit = <span id="nuEmit">0.00</span> ×10¹⁵ Hz</div><div>吸收光子频率 ν_abs = <span id="nuAbs">0.00</span> ×10¹⁵ Hz</div><div>反冲修正：Δν/ν₀ = <span id="recoilFrac">0.00</span></div></div>
<div id="control"><div><label>跃迁能级差 ΔW (eV)</label><input type="range" id="deltaW" min="1" max="100" step="1" value="10"><span id="deltaWVal">10</span></div>
<div><label>原子质量 m₀ (u)</label><input type="range" id="mass" min="1" max="200" step="1" value="100"><span id="massVal">100</span></div>
<button id="reset">重置相机</button></div>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050b1a);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000); camera.position.set(5,4,8);
const renderer=new THREE.WebGLRenderer(); renderer.setSize(window.innerWidth,window.innerHeight); document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
document.getElementById('reset').addEventListener('click',()=>{camera.position.set(5,4,8); controls.target.set(0,0,0); controls.update();});
const grid=new THREE.GridHelper(8,20,0x77aaff,0x335588); grid.position.y=-1; scene.add(grid);
const axes=new THREE.AxesHelper(5); scene.add(axes);
const ambient=new THREE.AmbientLight(0x404060); scene.add(ambient);
const light=new THREE.DirectionalLight(0xffffff,1); light.position.set(2,3,4); scene.add(light);
let atom, photon;
function update(){
    const deltaW=parseFloat(document.getElementById('deltaW').value); const m0=parseFloat(document.getElementById('mass').value)*1.66e-27;
    document.getElementById('deltaWVal').innerText=deltaW; document.getElementById('massVal').innerText=document.getElementById('mass').value;
    const h=6.626e-34; const c=3e8; const eV=1.6e-19;
    const deltaW_J=deltaW*eV; const nu0=deltaW_J/h;
    const recoilFrac=deltaW_J/(2*m0*c*c);
    const nuEmit=nu0*(1-recoilFrac); const nuAbs=nu0*(1+recoilFrac);
    document.getElementById('nuEmit').innerText=(nuEmit/1e15).toFixed(4);
    document.getElementById('nuAbs').innerText=(nuAbs/1e15).toFixed(4);
    document.getElementById('recoilFrac').innerText=recoilFrac.toExponential(3);
    if(atom) scene.remove(atom);
    atom=new THREE.Mesh(new THREE.SphereGeometry(0.35,32,32),new THREE.MeshStandardMaterial({color:0xffaa66,emissive:0x442200}));
    atom.position.set(0,0,0); scene.add(atom);
    if(photon) scene.remove(photon);
    photon=new THREE.ArrowHelper(new THREE.Vector3(1,0.5,0).normalize(), new THREE.Vector3(0.8,0.3,0), 1.2, 0xffaa66, 0.5, 0.3);
    scene.add(photon);
}
document.getElementById('deltaW').addEventListener('input',update); document.getElementById('mass').addEventListener('input',update);
update();
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
</script>
</body>
</html>
