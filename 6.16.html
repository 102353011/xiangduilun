<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>相对论：运动带电直线与点电荷的相互作用</title><style>body{margin:0;overflow:hidden;font-family:monospace}#info{position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.7);padding:12px;border-radius:12px;color:#fff;z-index:20}#calc{position:absolute;top:20px;right:20px;width:260px;background:rgba(0,0,0,0.7);padding:12px;border-radius:12px;color:#ffdd99;z-index:20}#control{position:absolute;bottom:20px;left:20px;right:20px;background:rgba(0,0,0,0.7);border-radius:40px;padding:10px;display:flex;gap:20px;justify-content:center;z-index:20}</style></head>
<body>
<div id="info"><h1>⚡ 运动带电直线与点电荷的相互作用</h1><p>无限长均匀带电直线(线密度λ)以速度v运动，点电荷q平行运动，相距d</p></div>
<div id="calc"><h3>📐 力的大小</h3><div>F = λq/(2πε₀d)  (与速度无关!)</div><div id="forceDisplay">当前力: <span id="forceVal">0.00</span> N (相对论不变)</div></div>
<div id="control"><div><label>线密度 λ (nC/m)</label><input type="range" id="lambda" min="1" max="20" step="1" value="10"><span id="lambdaVal">10</span></div>
<div><label>速度 β = v/c</label><input type="range" id="beta" min="0" max="0.95" step="0.01" value="0.5"><span id="betaVal">0.50</span></div>
<div><label>距离 d (cm)</label><input type="range" id="dist" min="2" max="15" step="1" value="8"><span id="distVal">8</span></div>
<button id="reset">重置相机</button></div>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050b1a);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000); camera.position.set(6,4,8);
const renderer=new THREE.WebGLRenderer(); renderer.setSize(window.innerWidth,window.innerHeight); document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
document.getElementById('reset').addEventListener('click',()=>{camera.position.set(6,4,8); controls.target.set(0,0,0); controls.update();});
const grid=new THREE.GridHelper(10,20,0x77aaff,0x335588); grid.position.y=-1; scene.add(grid);
const axes=new THREE.AxesHelper(6); axes.material.transparent=true; axes.material.opacity=0.2; scene.add(axes);
const ambient=new THREE.AmbientLight(0x404060); scene.add(ambient);
const light=new THREE.DirectionalLight(0xffffff,1); light.position.set(2,3,4); scene.add(light);
let lineCharge, pointCharge;
function update(){
    const lambda=parseFloat(document.getElementById('lambda').value)/1e9;
    const beta=parseFloat(document.getElementById('beta').value);
    const d=parseFloat(document.getElementById('dist').value)/100;
    document.getElementById('lambdaVal').innerText=document.getElementById('lambda').value;
    document.getElementById('betaVal').innerText=beta.toFixed(2);
    document.getElementById('distVal').innerText=document.getElementById('dist').value;
    const eps0=8.85e-12; const q=1e-9;
    const F=lambda*q/(2*Math.PI*eps0*d);
    document.getElementById('forceVal').innerText=F.toExponential(3);
    if(lineCharge) scene.remove(lineCharge);
    const points=[];
    for(let x=-5;x<=5;x+=0.1) points.push(new THREE.Vector3(x,0,0));
    const geo=new THREE.BufferGeometry().setFromPoints(points);
    const mat=new THREE.LineBasicMaterial({color:0xffaa66});
    lineCharge=new THREE.Line(geo,mat); scene.add(lineCharge);
    if(pointCharge) scene.remove(pointCharge);
    const sphereGeo=new THREE.SphereGeometry(0.15,32,32);
    const sphereMat=new THREE.MeshStandardMaterial({color:0xff6666,emissive:0x441111});
    pointCharge=new THREE.Mesh(sphereGeo,sphereMat); pointCharge.position.set(0,d,0.5);
    scene.add(pointCharge);
}
const lambdaSlider=document.getElementById('lambda'); const betaSlider=document.getElementById('beta'); const distSlider=document.getElementById('dist');
lambdaSlider.addEventListener('input',update); betaSlider.addEventListener('input',update); distSlider.addEventListener('input',update);
update();
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
</body>
</html>
