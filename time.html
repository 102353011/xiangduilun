
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>狭义相对论：时间膨胀效应 | 光钟动态3D演示</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'Segoe UI', 'Poppins', 'Roboto', sans-serif;
            color: white;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 28px;
            pointer-events: none;
            z-index: 10;
            font-size: 13px;
            border-left: 5px solid #4cafef;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            font-family: monospace;
            max-width: 420px;
        }
        #info h1 {
            margin: 0 0 4px;
            font-size: 1.1rem;
        }
        #info p {
            margin: 0;
            font-size: 0.75rem;
            opacity: 0.85;
        }
        #controls {
            position: absolute;
            bottom: 25px;
            left: 20px;
            right: 20px;
            background: rgba(10, 20, 35, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 28px;
            padding: 18px 28px;
            color: white;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            z-index: 20;
            font-family: monospace;
            border: 1px solid rgba(255,200,100,0.3);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            pointer-events: auto;
        }
        .slider-container {
            flex: 3;
            min-width: 220px;
        }
        .speed-value {
            flex: 1;
            text-align: center;
            background: #000000aa;
            padding: 6px 15px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid #ffaa5566;
        }
        .time-panel {
            display: flex;
            gap: 25px;
            background: #0a1428cc;
            padding: 6px 20px;
            border-radius: 48px;
            font-weight: bold;
        }
        .time-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .time-label {
            font-size: 12px;
            color: #ccddee;
        }
        .time-value {
            font-size: 22px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
        }
        .static-color { color: #4cafef; text-shadow: 0 0 3px #0088ff; }
        .moving-color { color: #ffaa66; text-shadow: 0 0 3px #ff7733; }
        button {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            border: 1px solid #ffaa6655;
        }
        button:hover {
            background: #ff884d;
            color: #0a0a1a;
            transform: scale(1.02);
        }
        input {
            width: 100%;
            cursor: pointer;
            accent-color: #ffaa55;
        }
        @media (max-width: 700px) {
            .time-panel { gap: 12px; padding: 5px 15px; }
            .time-value { font-size: 18px; }
            #controls { flex-direction: column; align-items: stretch; bottom: 15px; left: 15px; right: 15px; padding: 15px; }
        }
        .note {
            font-size: 10px;
            opacity: 0.7;
        }
        .badge {
            background: #ffaa3322;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>⏰ 时间膨胀效应 · 光钟动态3D演示 | 狭义相对论</h1>
        <p>🔵 静止光钟 (蓝色) : 光子垂直运动，时间流逝正常 | 🔴 运动光钟 (红色) : 光子走斜线，时间流逝变慢<br>
        🚀 速度越快 → 斜线路径越长 → 运动时钟走得越慢 → 时间膨胀</p>
    </div>
    <div id="controls">
        <div class="slider-container">
            <label style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span>🚀 运动光钟速度 v / c : </span>
                <span id="speedPercent" style="color:#ffcc88; font-weight: bold;">60.0% c</span>
            </label>
            <input type="range" id="velocitySlider" min="0" max="0.99" step="0.002" value="0.6">
        </div>
        <div class="speed-value">
            β = v/c = <span id="betaVal">0.6000</span><br>
            γ = <span id="gammaVal">1.250</span>
        </div>
        <div class="time-panel">
            <div class="time-item">
                <span class="time-label static-color">🔵 静止光钟 (固有时间)</span>
                <span class="time-value static-color" id="staticTime">1.00</span>
                <span style="font-size:13px;">t₀</span>
            </div>
            <div class="time-item">
                <span class="time-label moving-color">🔴 运动光钟 (膨胀时间)</span>
                <span class="time-value moving-color" id="movingTime">1.25</span>
                <span style="font-size:13px;">t = γ·t₀</span>
            </div>
        </div>
        <button id="resetBtn">🔄 重置速度 (0.6c)</button>
        <div class="note">💡 运动速度越快 → γ 因子越大 → 运动时钟走得越慢 (时间膨胀)</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.008);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(6, 4, 12);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.zoomSpeed = 1.0;
        controls.target.set(0, 0, 0);

        // --- 星空背景 ---
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 200;
            starPositions[i*3+1] = (Math.random() - 0.5) * 100;
            starPositions[i*3+2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.08, transparent: true, opacity: 0.6 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // 地面网格参考
        const gridHelper = new THREE.GridHelper(20, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -1.5;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.3;
        scene.add(gridHelper);

        // 光源
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(3, 5, 2);
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466cc, 0.3);
        backLight.position.set(-2, 1, -3);
        scene.add(backLight);

        // ========== 光钟模型 ==========
        // 两个光钟并排放置：左边静止 (蓝色)，右边运动 (红色)
        
        // ---- 1. 静止光钟 (左侧，x = -2.5) ----
        const staticClockGroup = new THREE.Group();
        staticClockGroup.position.set(-2.5, 0, 0);
        
        // 钟体框架 (长方体)
        const frameGeo = new THREE.BoxGeometry(1.2, 2.0, 0.3);
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a86ff, transparent: true, opacity: 0.4, wireframe: false });
        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.castShadow = true;
        staticClockGroup.add(frame);
        
        // 边框发光
        const edgesGeo = new THREE.EdgesGeometry(frameGeo);
        const edgesMat = new THREE.LineBasicMaterial({ color: 0x7abaff });
        const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
        staticClockGroup.add(wireframe);
        
        // 上下反射镜 (圆盘)
        const mirrorMat = new THREE.MeshStandardMaterial({ color: 0x88aaff, metalness: 0.9, roughness: 0.2 });
        const topMirror = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.08, 24), mirrorMat);
        topMirror.position.set(0, 0.9, 0);
        staticClockGroup.add(topMirror);
        
        const bottomMirror = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.08, 24), mirrorMat);
        bottomMirror.position.set(0, -0.9, 0);
        staticClockGroup.add(bottomMirror);
        
        // 光子小球 (蓝色)
        const photonStatic = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), new THREE.MeshStandardMaterial({ color: 0x4cafef, emissive: 0x2266aa, emissiveIntensity: 0.8 }));
        staticClockGroup.add(photonStatic);
        
        // 光路轨迹 (垂直线)
        const trailPointsStatic = [];
        for (let y = -0.85; y <= 0.85; y += 0.05) trailPointsStatic.push(new THREE.Vector3(0, y, 0.16));
        const trailLineStatic = new THREE.Line(new THREE.BufferGeometry().setFromPoints(trailPointsStatic), new THREE.LineBasicMaterial({ color: 0x4cafef, transparent: true, opacity: 0.4 }));
        staticClockGroup.add(trailLineStatic);
        
        scene.add(staticClockGroup);
        
        // 静止光钟标签
        const staticLabelDiv = document.createElement('div');
        staticLabelDiv.textContent = '🔵 静止光钟 (参考系)';
        staticLabelDiv.style.cssText = 'color:#aaddff; background:rgba(0,0,0,0.6); padding:2px 12px; border-radius:20px; font-size:11px; border-left:3px solid #4cafef;';
        const staticLabel = new CSS2DObject(staticLabelDiv);
        staticLabel.position.set(-2.5, 1.3, 0);
        scene.add(staticLabel);
        
        // ---- 2. 运动光钟 (右侧，x = 2.5) ----
        const movingClockGroup = new THREE.Group();
        movingClockGroup.position.set(2.5, 0, 0);
        
        const frameMovingMat = new THREE.MeshStandardMaterial({ color: 0xff5e4a, transparent: true, opacity: 0.4 });
        const movingFrame = new THREE.Mesh(frameGeo, frameMovingMat);
        movingFrame.castShadow = true;
        movingClockGroup.add(movingFrame);
        
        const movingEdgesGeo = new THREE.EdgesGeometry(frameGeo);
        const movingEdgesMat = new THREE.LineBasicMaterial({ color: 0xffaa88 });
        const movingWireframe = new THREE.LineSegments(movingEdgesGeo, movingEdgesMat);
        movingClockGroup.add(movingWireframe);
        
        const mirrorMovingMat = new THREE.MeshStandardMaterial({ color: 0xffaa77, metalness: 0.8 });
        const topMirrorMoving = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.08, 24), mirrorMovingMat);
        topMirrorMoving.position.set(0, 0.9, 0);
        movingClockGroup.add(topMirrorMoving);
        
        const bottomMirrorMoving = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.08, 24), mirrorMovingMat);
        bottomMirrorMoving.position.set(0, -0.9, 0);
        movingClockGroup.add(bottomMirrorMoving);
        
        // 光子小球 (红色)
        const photonMoving = new THREE.Mesh(new THREE.SphereGeometry(0.12, 32, 32), new THREE.MeshStandardMaterial({ color: 0xffaa66, emissive: 0xff4422, emissiveIntensity: 0.8 }));
        movingClockGroup.add(photonMoving);
        
        scene.add(movingClockGroup);
        
        // 运动光钟标签
        const movingLabelDiv = document.createElement('div');
        movingLabelDiv.textContent = '🔴 运动光钟 (速度 v)';
        movingLabelDiv.style.cssText = 'color:#ffccaa; background:rgba(0,0,0,0.6); padding:2px 12px; border-radius:20px; font-size:11px; border-left:3px solid #ffaa66;';
        const movingLabel = new CSS2DObject(movingLabelDiv);
        movingLabel.position.set(2.5, 1.3, 0);
        scene.add(movingLabel);
        
        // 额外显示运动方向的箭头 (动态旋转)
        const arrowHelper = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(3.5, 0.5, 1), 1.2, 0xffaa66, 0.6, 0.4);
        scene.add(arrowHelper);
        
        // 运动光钟的运动路径指示器 (半透明轨道)
        const orbitPoints = [];
        for (let x = -1; x <= 6; x += 0.1) orbitPoints.push(new THREE.Vector3(x, -1.2, 1.5));
        const orbitLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(orbitPoints), new THREE.LineBasicMaterial({ color: 0xffaa55, transparent: true, opacity: 0.3 }));
        scene.add(orbitLine);
        
        // 运动光钟的水平移动范围
        let movingClockX = 2.5;
        let moveDirection = 1;
        let moveSpeed = 0.8;  // 动态更新
        
        // 光子的垂直运动变量
        let staticPhotonY = -0.85;
        let movingPhotonY = -0.85;
        let staticDirection = 1;
        let movingDirection = 1;
        
        // 时间膨胀参数
        let currentBeta = 0.6;
        let currentGamma = 1.25;
        
        // 运动光钟的光子斜线路径 (需要动态计算)
        // 为了视觉效果，运动光钟的光子仍然做垂直运动，但速度会变慢 (模拟时间膨胀)
        // 更直观：让运动光钟的光子运动速度变慢，表示时间流逝变慢
        
        function updateTimeDilation(beta) {
            const gamma = 1 / Math.sqrt(1 - beta * beta);
            currentGamma = gamma;
            
            // 更新UI
            document.getElementById('betaVal').innerText = beta.toFixed(4);
            document.getElementById('gammaVal').innerText = gamma.toFixed(4);
            document.getElementById('speedPercent').innerHTML = `${(beta*100).toFixed(1)}% c`;
            document.getElementById('staticTime').innerText = '1.00';
            document.getElementById('movingTime').innerText = gamma.toFixed(4);
            
            // 运动光钟的时间膨胀因子：光子运动速度与 γ 成反比
            // 运动光钟的光子垂直速度 = 静止光钟速度 / γ (模拟时间变慢)
            // 同时运动光钟整体水平移动速度与 beta 成正比
            
            // 更新运动光钟标签
            movingLabelDiv.textContent = `🔴 运动光钟 (v = ${(beta*100).toFixed(1)}% c)  时间膨胀: t = ${gamma.toFixed(3)}·t₀`;
            
            // 更新箭头颜色/亮度
            const intensity = 0.4 + beta * 0.8;
            arrowHelper.setColor(beta > 0.5 ? 0xff8866 : 0xffaa66);
            
            // 运动速度 (水平移动)
            moveSpeed = 0.6 + beta * 2.5;
        }
        
        // 滑块控制
        const slider = document.getElementById('velocitySlider');
        const resetBtn = document.getElementById('resetBtn');
        
        function setSpeed() {
            const val = parseFloat(slider.value);
            currentBeta = val;
            updateTimeDilation(currentBeta);
        }
        
        slider.addEventListener('input', setSpeed);
        resetBtn.addEventListener('click', () => {
            slider.value = '0.6';
            setSpeed();
            movingClockX = 2.5;
            movingClockGroup.position.x = 2.5;
            moveDirection = 1;
        });
        setSpeed();
        
        // 动画变量
        let lastTimestamp = performance.now();
        let staticCycleCount = 0;
        let movingCycleCount = 0;
        
        // 添加光晕粒子效果增强视觉
        const glowParticles = new THREE.BufferGeometry();
        const glowCount = 300;
        const glowPositions = new Float32Array(glowCount * 3);
        for (let i = 0; i < glowCount; i++) {
            glowPositions[i*3] = (Math.random() - 0.5) * 8;
            glowPositions[i*3+1] = (Math.random() - 0.5) * 4;
            glowPositions[i*3+2] = (Math.random() - 0.5) * 5 - 2;
        }
        glowParticles.setAttribute('position', new THREE.BufferAttribute(glowPositions, 3));
        const glowMat = new THREE.PointsMaterial({ color: 0x88aaff, size: 0.04, transparent: true, opacity: 0.4 });
        const glowPointsObj = new THREE.Points(glowParticles, glowMat);
        scene.add(glowPointsObj);
        
        function animate() {
            const now = performance.now();
            let delta = Math.min(0.033, (now - lastTimestamp) / 1000);
            lastTimestamp = now;
            
            // 静止光钟的光子运动 (速度恒定)
            const staticSpeed = 1.8;  // 上下往返一次约 1.1 秒
            let staticStep = staticSpeed * delta;
            staticPhotonY += staticStep * staticDirection;
            if (staticPhotonY >= 0.85) {
                staticPhotonY = 0.85;
                staticDirection = -1;
                staticCycleCount++;
            } else if (staticPhotonY <= -0.85) {
                staticPhotonY = -0.85;
                staticDirection = 1;
                staticCycleCount++;
            }
            photonStatic.position.set(0, staticPhotonY, 0.16);
            
            // 运动光钟的光子运动 (速度受时间膨胀影响: 变慢 1/γ 倍)
            const movingSpeed = staticSpeed / currentGamma;
            let movingStep = movingSpeed * delta;
            movingPhotonY += movingStep * movingDirection;
            if (movingPhotonY >= 0.85) {
                movingPhotonY = 0.85;
                movingDirection = -1;
                movingCycleCount++;
            } else if (movingPhotonY <= -0.85) {
                movingPhotonY = -0.85;
                movingDirection = 1;
                movingCycleCount++;
            }
            photonMoving.position.set(0, movingPhotonY, 0.16);
            
            // 运动光钟整体水平移动 (模拟运动参考系)
            let moveStep = moveSpeed * delta;
            movingClockX += moveStep * moveDirection;
            if (movingClockX >= 4.5) {
                movingClockX = 4.5;
                moveDirection = -1;
            } else if (movingClockX <= 0.5) {
                movingClockX = 0.5;
                moveDirection = 1;
            }
            movingClockGroup.position.x = movingClockX;
            
            // 更新箭头方向
            arrowHelper.setDirection(new THREE.Vector3(moveDirection, 0, 0));
            
            // 根据速度改变光子发光强度
            const glowIntensity = 0.6 + currentBeta * 1.0;
            photonMoving.material.emissiveIntensity = glowIntensity;
            photonStatic.material.emissiveIntensity = 0.6;
            
            // 星星缓慢旋转
            stars.rotation.y += 0.0005;
            glowPointsObj.rotation.y += 0.002;
            glowPointsObj.rotation.x = Math.sin(Date.now() * 0.001) * 0.1;
            
            // 动态更新运动光钟标签位置跟随
            movingLabel.position.set(movingClockX, 1.3, 0);
            
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
        
        // 定时更新CSS2D标签中静止光钟的周期计数 (可选，增加可读性)
        setInterval(() => {
            const staticLabelDiv2 = document.createElement('div');
            staticLabelDiv2.textContent = `🔵 静止光钟 | 光子往返周期: ${staticCycleCount}`;
            staticLabelDiv2.style.cssText = 'color:#aaddff; background:rgba(0,0,0,0.6); padding:2px 12px; border-radius:20px; font-size:10px;';
            staticLabel.element.innerHTML = `🔵 静止光钟 | 周期计数: ${staticCycleCount}`;
            movingLabel.element.innerHTML = `🔴 运动光钟 | 周期计数: ${movingCycleCount}  |  γ = ${currentGamma.toFixed(3)}`;
        }, 500);
        
        console.log('时间膨胀效应演示 | 静止光钟 vs 运动光钟 | 运动速度越快 → 光子运动越慢 → 时间膨胀');
    </script>
</body>
</html>
```
