<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>相对论：由衰变产物反推母粒子质量</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'Microsoft YaHei', monospace; }
        #info-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); border-radius: 16px; padding: 12px 20px; color: white; z-index: 20; pointer-events: none; border-left: 4px solid #ffaa44; max-width: 360px; }
        #info-panel h1 { margin: 0 0 6px; font-size: 1.1rem; }
        .formula { font-family: monospace; background: #00000066; padding: 4px 8px; border-radius: 8px; margin-top: 8px; font-size: 0.75rem; color: #ffdd99; }
        #calc-panel { position: absolute; top: 20px; right: 20px; width: 310px; background: rgba(10,14,28,0.92); backdrop-filter: blur(12px); border-radius: 16px; padding: 12px; color: #eef; font-size: 12px; border: 1px solid rgba(255,200,100,0.4); z-index: 20; pointer-events: auto; }
        #calc-panel h3 { margin: 0 0 10px; color: #ffcc88; text-align: center; }
        .calc-step { border-left: 3px solid #ffaa66; padding-left: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.2); border-radius: 0 8px 8px 0; }
        .result-value { font-size: 1rem; color: #ffdd99; font-weight: bold; text-align: center; background: #00000066; padding: 8px; border-radius: 10px; margin-top: 8px; }
        #control-bar { position: absolute; bottom: 20px; left: 20px; right: 20px; background: rgba(20,24,45,0.94); backdrop-filter: blur(14px); border-radius: 40px; padding: 10px 20px; display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; z-index: 25; pointer-events: auto; }
        .ctrl-group { background: rgba(0,0,0,0.6); border-radius: 40px; padding: 5px 14px; text-align: center; }
        .ctrl-group label { font-size: 10px; color: #ccc; display: block; }
        input { width: 100px; cursor: pointer; accent-color: #ffaa44; }
        .value { color: #ffaa66; font-weight: bold; }
        button { background: #2c5a7a; border: none; padding: 5px 14px; border-radius: 40px; color: white; cursor: pointer; }
    </style>
</head>
<body>
<div id="info-panel"><h1>🔍 由衰变产物反推母粒子质量</h1><p>已知衰变产物 m₁、m₂，动量 p₁、p₂，夹角 θ，求母粒子质量 m。</p><div class="formula">m²c⁴ = (E₁+E₂)² - (p₁+p₂)²c²</div></div>
<div id="calc-panel"><h3>📐 计算结果</h3><div class="calc-step">❶ E₁ = √(m₁²c⁴ + p₁²c²), E₂ = √(m₂²c⁴ + p₂²c²)</div>
<div class="calc-step">❷ 总能量 E = E₁+E₂，总动量 p = √(p₁²+p₂²+2p₁p₂cosθ)</div>
<div class="calc-step">❸ 母粒子质量 m = √(E²/c⁴ - p²/c²)</div>
<div class="result-value">母粒子质量 m = <span id="mParent">0.00</span> MeV/c²</div></div>
<div id="control-bar"><div class="ctrl-group"><label>m₁ (MeV/c²)</label><input type="range" id="m1" min="50" max="300" step="10" value="150"><span id="m1Val">150</span></div>
<div class="ctrl-group"><label>m₂ (MeV/c²)</label><input type="range" id="m2" min="50" max="300" step="10" value="200"><span id="m2Val">200</span></div>
<div class="ctrl-group"><label>p₁ (MeV/c)</label><input type="range" id="p1" min="0" max="500" step="10" value="250"><span id="p1Val">250</span></div>
<div class="ctrl-group"><label>p₂ (MeV/c)</label><input type="range" id="p2" min="0" max="500" step="10" value="250"><span id="p2Val">250</span></div>
<div class="ctrl-group"><label>夹角 θ (°)</label><input type="range" id="theta" min="0" max="180" step="5" value="60"><span id="thetaVal">60°</span></div>
<button id="resetView">重置相机</button></div>

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.128.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three'; import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x050b1a);
const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000); camera.position.set(6,4,9);
const renderer=new THREE.WebGLRenderer(); renderer.setSize(window.innerWidth,window.innerHeight); document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
document.getElementById('resetView').addEventListener('click',()=>{camera.position.set(6,4,9); controls.target.set(0,0,0); controls.update();});
const grid=new THREE.GridHelper(10,20,0x77aaff,0x335588); grid.position.y=-1; scene.add(grid);
const axes=new THREE.AxesHelper(6); axes.material.transparent=true; axes.material.opacity=0.2; scene.add(axes);
const ambient=new THREE.AmbientLight(0x404060); scene.add(ambient);
const light=new THREE.DirectionalLight(0xffffff,1); light.position.set(2,3,4); scene.add(light);
let arrow1, arrow2, sphere1, sphere2;
function updateMass(){
    const m1=parseFloat(document.getElementById('m1').value); const m2=parseFloat(document.getElementById('m2').value);
    const p1=parseFloat(document.getElementById('p1').value); const p2=parseFloat(document.getElementById('p2').value);
    const theta=parseFloat(document.getElementById('theta').value)*Math.PI/180;
    document.getElementById('m1Val').innerText=m1; document.getElementById('m2Val').innerText=m2;
    document.getElementById('p1Val').innerText=p1; document.getElementById('p2Val').innerText=p2;
    document.getElementById('thetaVal').innerText=document.getElementById('theta').value+"°";
    const E1=Math.sqrt(m1*m1+p1*p1); const E2=Math.sqrt(m2*m2+p2*p2);
    const Etot=E1+E2;
    const ptot=Math.sqrt(p1*p1+p2*p2+2*p1*p2*Math.cos(theta));
    const mParent=Math.sqrt(Etot*Etot-ptot*ptot);
    document.getElementById('mParent').innerText=mParent.toFixed(2);
    if(arrow1) scene.remove(arrow1); if(arrow2) scene.remove(arrow2);
    if(sphere1) scene.remove(sphere1); if(sphere2) scene.remove(sphere2);
    const dir1=new THREE.Vector3(1, Math.sin(theta/2), 0).normalize();
    const dir2=new THREE.Vector3(1, -Math.sin(theta/2), 0).normalize();
    const len1=p1/150; const len2=p2/150;
    sphere1=new THREE.Mesh(new THREE.SphereGeometry(0.25,32,32),new THREE.MeshStandardMaterial({color:0xff6666}));
    sphere1.position.set(-1.5,0,0); scene.add(sphere1);
    sphere2=new THREE.Mesh(new THREE.SphereGeometry(0.25,32,32),new THREE.MeshStandardMaterial({color:0x66ff66}));
    sphere2.position.set(-1.5,0,0); scene.add(sphere2);
    if(len1>0.02) arrow1=new THREE.ArrowHelper(dir1, new THREE.Vector3(-0.8,0,0), len1, 0xff8888, 0.5, 0.3);
    if(len2>0.02) arrow2=new THREE.ArrowHelper(dir2, new THREE.Vector3(-0.8,0,0), len2, 0x88ff88, 0.5, 0.3);
    if(arrow1) scene.add(arrow1); if(arrow2) scene.add(arrow2);
}
document.getElementById('m1').addEventListener('input',updateMass); document.getElementById('m2').addEventListener('input',updateMass);
document.getElementById('p1').addEventListener('input',updateMass); document.getElementById('p2').addEventListener('input',updateMass);
document.getElementById('theta').addEventListener('input',updateMass);
updateMass();
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
animate();
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
</body>
</html>
